<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover обязателен: без него в автономном режиме шапка
     уезжает под часы. user-scalable=no запрещён правилом доступности. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сходу — английский, который уже у тебя</title>
<meta name="description" content="Начни с двухсот английских слов, которые ты уже знаешь.">

<!-- Двух значений theme_color в манифесте пока нет ни в одном браузере,
     поэтому тема адреса задаётся мета-тегами. Safari их уважает. -->
<meta name="theme-color" content="#F6F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сходу">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="src/ui/tokens.css">
<link rel="stylesheet" href="src/ui/base.css">
<link rel="stylesheet" href="src/ui/session.css">
</head>
